apiVersion: v1
kind: ConfigMap
metadata:
  name: log-demo-app
  namespace: demo
data:
  app.py: |
    import json
    import logging
    import sys
    import traceback
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    logging.basicConfig(
        stream=sys.stdout,
        level=logging.INFO,
        format="%(message)s",
    )

    def emit(level, message, trace_id="demo-trace-001"):
        logging.log(
            getattr(logging, level.upper()),
            json.dumps(
                {
                    "ts": datetime.now(timezone.utc).isoformat(),
                    "level": level,
                    "service": "log-demo",
                    "trace_id": trace_id,
                    "message": message,
                },
                ensure_ascii=False,
            ),
        )

    class Handler(BaseHTTPRequestHandler):
        def _send(self, status, body):
            self.send_response(status)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.end_headers()
            self.wfile.write(body.encode("utf-8"))

        def do_GET(self):
            if self.path == "/error":
                try:
                    raise RuntimeError("demo error for Loki")
                except RuntimeError:
                    emit("error", "demo error for Loki")
                    traceback.print_exc()
                self._send(500, "error\n")
                return

            emit("info", "hello from log-demo")
            self._send(200, "ok\n")

        def log_message(self, fmt, *args):
            return

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo
  namespace: demo
  labels:
    app: log-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-demo
  template:
    metadata:
      labels:
        app: log-demo
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: log-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: log-demo
  namespace: demo
spec:
  selector:
    app: log-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
