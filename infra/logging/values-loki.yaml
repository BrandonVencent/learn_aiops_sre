# Loki 单机模式（Monolithic），文件系统存储
# 安装命令：helm upgrade --install loki grafana-community/loki -n logging -f values-loki.yaml
deploymentMode: Monolithic

singleBinary:
  enabled: true
  replicas: 1
  # 不使用 ruler/rule ConfigMap，关闭 rules sidecar，避免额外容器
  sidecar: false

  # 放在 worker-2，避免和 server 上的 Prometheus/Grafana 抢内存
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

loki:
  # 实验环境不做多租户，Fluent Bit 不需要 X-Scope-OrgID
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

# 不用 nginx gateway；Fluent Bit 直接写 loki:3100
gateway:
  enabled: false

# 关闭 canary、MinIO 和查询缓存，节省内存
lokiCanary:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
# chart 默认还会启用 memcached 和 exporter；缓存已关，显式关闭避免多余对象
memcached:
  enabled: false
memcachedExporter:
  enabled: false
# 不使用 ruler 规则，关闭 rules sidecar；该 sidecar 默认没有 requests/limits
sidecar:
  rules:
    enabled: false
test:
  enabled: false

# Monolithic 模式下把分布式组件副本清零
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
