apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    # kube-prometheus-stack 的 Grafana datasource sidecar 用这个标签发现配置
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherType: regex
              # 匹配外层转义 JSON 里的 trace_id；捕获 32 位十六进制
              matcherRegex: 'trace_id[^a-f0-9]*([a-f0-9]{32})'
              datasourceUid: tempo
              # 两个 $$ 是 Grafana provisioning 的转义，最终是 ${__value.raw}
              url: '$${__value.raw}'
              urlDisplayLabel: 'View trace'
              targetBlank: true
