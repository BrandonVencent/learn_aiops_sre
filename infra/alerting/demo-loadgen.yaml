apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-loadgen
  namespace: demo
  labels:
    app: demo-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-loadgen
  template:
    metadata:
      labels:
        app: demo-loadgen
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1
      containers:
        - name: loadgen
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -T 2 -O /dev/null \
                  "http://log-demo.demo.svc.cluster.local:8080${TARGET_PATH}" || true
                sleep "${INTERVAL_SECONDS}"
              done
          env:
            - name: TARGET_PATH
              value: "/"
            - name: INTERVAL_SECONDS
              value: "2"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
