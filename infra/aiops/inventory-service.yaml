apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-app
  namespace: demo
data:
  server.py: |
    import json
    import os
    import time
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SERVICE_NAME = "inventory"
    DELAY_MS = int(os.getenv("DELAY_MS", "0"))
    FAIL_MODE = os.getenv("FAIL_MODE", "0") == "1"


    def emit(level, message, **fields):
        record = {
            "ts": datetime.now(timezone.utc).isoformat(),
            "level": level,
            "service": SERVICE_NAME,
            "message": message,
            **fields,
        }
        print(json.dumps(record, ensure_ascii=False), flush=True)


    class Handler(BaseHTTPRequestHandler):
        def _send(self, status, body, content_type="application/json; charset=utf-8"):
            payload = body.encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            path = self.path.split("?", 1)[0]

            if path == "/healthz":
                self._send(200, "ok\n", "text/plain; charset=utf-8")
                return

            if path != "/item":
                self._send(404, '{"error":"not found"}\n')
                return

            started = time.perf_counter()

            if FAIL_MODE:
                emit("error", "inventory failure", path=path)
                self._send(500, '{"error":"inventory failure"}\n')
                return

            if DELAY_MS > 0:
                time.sleep(DELAY_MS / 1000.0)

            elapsed_ms = round((time.perf_counter() - started) * 1000, 3)
            emit(
                "info",
                "inventory served",
                path=path,
                delay_ms=DELAY_MS,
                elapsed_ms=elapsed_ms,
            )
            self._send(200, '{"item":"ok"}\n')

        def log_message(self, fmt, *args):
            return


    if __name__ == "__main__":
        emit(
            "info",
            "inventory listening",
            port=8080,
            delay_ms=DELAY_MS,
            fail_mode=FAIL_MODE,
        )
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - /app/server.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DELAY_MS
              value: "0"
            - name: FAIL_MODE
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: inventory-app
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
  labels:
    app: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8080
      targetPort: http
