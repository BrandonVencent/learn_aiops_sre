apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-summary
  namespace: aiops
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - aiops
  selector:
    matchLabels:
      app: ai-summary
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
