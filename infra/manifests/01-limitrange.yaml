apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: aiops
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 1Gi
---
